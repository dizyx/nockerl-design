<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 20 64 56" width="64" height="56" role="img" aria-label="Nockerl">
  <title>Nockerl</title>
  <!-- Three overlapping peaks in three distinct grayscale shades. The shade
       difference is what gives the mark its layered, dimensional read; a single
       flat fill is incorrect. Painted left, centre, right. Ink set for LIGHT
       surfaces. -->
  <polygon points="20,72 36,36 52,72" fill="#555555" />
  <polygon points="32,72 48,24 64,72" fill="#222222" />
  <polygon points="44,72 60,32 76,72" fill="#777777" />
</svg>
